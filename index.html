<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MicksGames</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#" id="logo"><i>&#10043;</i> MicksGames <em>~/games</em> <small id="count"></small></a>
  <label class="search"><span class="sr">Suchen</span><b>&gt;</b><input id="search" type="search" placeholder="search games   ( / )" autocomplete="off"></label>
</header>

<main id="home">
  <nav class="cats" id="cats" aria-label="Kategorien"></nav>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<main id="play" hidden>
  <a class="back" href="#">&lt; cd ..</a>
  <div class="stage">
    <div>
      <div class="frame" id="frame" tabindex="-1">
        <iframe id="game" title="Spiel" allow="fullscreen; autoplay; gamepad" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms"></iframe>
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="bar">
        <button class="btn" id="fs" type="button">Vollbild</button>
        <button class="btn ghost" id="reload" type="button">Neu starten</button>
        <button class="btn ghost" id="fav" type="button" aria-pressed="false">Favorit</button>
      </div>
    </div>
    <aside class="info">
      <h1 id="i-title"></h1>
      <p class="tag" id="i-cat"></p>
      <p id="i-desc"></p>
      <a class="btn ghost" id="i-link" target="_blank" rel="noopener noreferrer" hidden>Website öffnen</a>
    </aside>
  </div>
  <h2 class="more-h" id="more-h">more-games</h2>
  <section class="grid small" id="more"></section>
</main>
<script src="Library/games.js"></script>
<script src="script.js"></script>
</body>
</html>
