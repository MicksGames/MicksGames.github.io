<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inkwild Survivors</title>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2118;--cream:#fff3d6;--paper:#f1dfae;--green:#5f9136;--blue:#1f3b5c;--orange:#e8832a;--red:#c8372d;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#6f9a45;font-family:Gaegu,'Comic Sans MS',cursive;font-weight:700;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 12px);text-align:center;overflow:auto}
.scr.on{display:flex}
.ov{background:rgba(43,33,24,.6)}
h1,h2,h3{font-family:Chewy,'Comic Sans MS',cursive;font-weight:400;margin:0}
h1{font-size:clamp(46px,11vw,104px);line-height:.95;color:var(--cream);text-shadow:4px 4px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink);transform:rotate(-2deg);animation:jig .6s steps(2) infinite}
h2{font-size:clamp(34px,7vw,56px);color:var(--cream);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
@keyframes jig{50%{transform:rotate(-1deg) translateY(-3px)}}
.btn{font:inherit;font-size:26px;padding:8px 30px;min-width:230px;background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:46% 54% 50% 50%/60% 50% 50% 40%;box-shadow:4px 5px 0 var(--ink);cursor:pointer;transition:transform .12s,background .12s}
.btn:hover,.btn:focus-visible{transform:translate(-2px,-3px) rotate(-1.5deg);background:#ffe29a;outline:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--orange);color:var(--cream);text-shadow:2px 2px 0 var(--ink);font-size:34px;padding:10px 44px}
.btn.sm{min-width:0;font-size:20px;padding:4px 16px}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:28px 34px 26px 36px;padding:18px 24px;box-shadow:6px 7px 0 var(--ink);max-width:min(900px,94vw)}
.panel.ink{filter:url(#wob)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{width:196px;padding:14px 12px;background:var(--cream);border:4px solid var(--ink);border-radius:22px 28px 24px 30px;box-shadow:5px 6px 0 var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:center}
.card:hover,.card:focus-visible,.card.cur{transform:translateY(-8px) rotate(-2deg);box-shadow:8px 12px 0 var(--ink);outline:none}
.card.cur{background:#ffe29a}
.card.sel{transform:scale(1.12) rotate(3deg);transition:transform .25s}
.card p{margin:4px 0 0;font-size:20px;line-height:1.1}
#cards .card{width:176px;padding:16px 10px}
#cards .ico{width:92px;height:92px;font-size:50px;margin-bottom:8px}
.stars{font-size:30px;line-height:1;letter-spacing:2px;margin:6px 0}
.stars b{font-weight:400;display:inline-block;color:#d8c9a0;-webkit-text-stroke:1.5px var(--ink)}
.stars b.on{color:#ffd23a}
.stars b.nx{color:#ffd23a;animation:pulse .7s steps(2) infinite}
@keyframes pulse{50%{transform:scale(1.3) rotate(12deg)}}
.card h3{font-size:24px}
.card small{font-size:17px;display:block}
.ico{width:64px;height:64px;margin:0 auto 6px;border:4px solid var(--ink);border-radius:48% 52% 45% 55%/55% 45% 55% 45%;display:grid;place-items:center;font-size:32px}
.rar{display:inline-block;padding:0 10px;border:3px solid var(--ink);border-radius:12px;font-size:16px;color:var(--cream)}
#hud{pointer-events:none;justify-content:flex-start;align-items:stretch;gap:6px;overflow:hidden;z-index:2}
#xpb{height:14px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);overflow:hidden}
#xpf,#hpf,#bf{display:block;height:100%;width:0;transition:width .12s}
#xpf{background:#4aa3c8}#hpf{background:var(--red)}#bf{background:var(--orange)}
#top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:24px}
#hpw{display:flex;align-items:center;gap:8px;min-width:150px;flex:1}
#hpw .bar{flex:1;max-width:220px}
.bar{height:20px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);overflow:hidden}
#tm{font-family:Chewy,cursive;font-size:38px;color:var(--cream);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
#lv{flex:1;text-align:right;font-size:26px;color:var(--cream);text-shadow:2px 2px 0 var(--ink)}
#boss{display:none;align-self:center;width:min(420px,90%);text-align:center;font-size:22px;color:var(--cream);text-shadow:2px 2px 0 var(--ink)}
#ic{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;flex-wrap:wrap;max-width:60%}
#ic span{position:relative;width:42px;height:42px;display:grid;place-items:center;background:var(--cream);border:3px solid var(--ink);border-radius:46% 54% 50% 50%;font-size:22px}
#ic span i{position:absolute;right:-4px;bottom:-6px;font:normal 11px Gaegu,cursive;letter-spacing:-1px;background:var(--ink);color:#ffd23a;border-radius:8px;padding:0 3px;white-space:nowrap}
#pb{pointer-events:auto;position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
#banner{position:absolute;left:0;right:0;top:28%;text-align:center;font-family:Chewy,cursive;font-size:clamp(34px,8vw,78px);color:var(--cream);text-shadow:4px 4px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink);opacity:0;transform:scale(.6) rotate(-3deg)}
#banner.show{animation:ban 2.4s forwards}
@keyframes ban{10%{opacity:1;transform:scale(1.1) rotate(2deg)}20%{transform:scale(1) rotate(-1deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.stat{font-size:26px;line-height:1.35}
#cards .card.up{width:212px;padding:0 0 14px;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.up .band{width:100%;height:104px;display:grid;place-items:center;border-bottom:4px solid var(--ink)}
.up h3{font-size:27px;line-height:1;padding:0 10px}
#cards .up p{margin:0;padding:0 12px;font-size:21px;line-height:1.1;min-height:46px;display:flex;align-items:center;justify-content:center}
#cards .up .stars{display:flex;flex-wrap:nowrap;gap:2px;justify-content:center;font-size:24px;letter-spacing:0;margin:2px 0 0}
.tag{position:absolute;top:8px;left:8px;padding:0 10px;border:3px solid var(--ink);border-radius:12px;font-size:17px;color:var(--cream);text-shadow:1px 1px 0 var(--ink);background:#1f3b5c;z-index:1}
.tag.NEW{background:#5f9136}.tag.EVOLVE{background:#e8832a}.tag.HEAL{background:#c8372d}.tag.BONUS{background:#7b4a8c}
#ic span svg{width:30px;height:30px}
#upg{padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 10px);justify-content:flex-start;gap:6px;overflow:hidden;background:rgba(31,28,22,.76)}
#uh{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 14px;gap:10px}
#uh h2{font-size:clamp(28px,5vw,44px)}
#uc{font-size:28px;color:#ffd23a;background:var(--ink);padding:2px 16px;border-radius:22px;min-width:110px}
#tv{flex:1;width:100%;position:relative;overflow:hidden;cursor:grab;touch-action:none;min-height:0}
#tv:active{cursor:grabbing}
#tw{position:absolute;left:0;top:0;transform-origin:0 0}
#zb{position:absolute;right:12px;bottom:6px;display:flex;flex-direction:column;gap:8px}
#ui{display:flex;align-items:center;gap:14px;width:min(640px,94vw);padding:10px 16px;text-align:left}
#ui svg{width:56px;height:56px;flex:none}
#ui .tx{flex:1;min-width:0}#ui h3{font-size:26px;line-height:1}#ui .ds{font-size:21px;line-height:1.1}#ui small{font-size:17px;opacity:.7}
.btn.poor{background:#e9b3a8}
.hx{position:absolute;width:96px;height:83px;margin:-41.5px 0 0 -48px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:var(--ink);cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1);animation:pop .55s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--d)*90ms)}
.hx>i{position:absolute;inset:5px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:var(--c)}
.hx>b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:400;pointer-events:none}
.hx svg{width:32px;height:32px}
.hx u{text-decoration:none;font:400 12px/1 Chewy,cursive;color:var(--cream);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.hx em{font:400 12px/1 Chewy,cursive;font-style:normal;color:#ffd23a;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.hx.poor em{color:#ffb4a8}.hx.poor{filter:saturate(.7)}
.hx .q{font:400 38px/1 Chewy,cursive;color:#9a917a}
.hx .em{font-size:32px;line-height:1}
.hx.ct{--c:#3d8fd8}.hx.av{--c:#4aa3c8}.hx.ow{--c:#f2a93b}.hx.lk{--c:#4a4538;cursor:default}
.hx:not(.lk):hover{transform:scale(1.1) rotate(-3deg);z-index:5}
.hx.sel{background:#fff3d6;z-index:4}
.hx.av{animation:pop .55s cubic-bezier(.3,1.6,.5,1) backwards,breathe 2.6s ease-in-out infinite;animation-delay:calc(var(--d)*90ms),calc(var(--d)*90ms + .6s)}
.hx.ow>i::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);background-size:250% 100%;animation:sheen 4s linear infinite;animation-delay:calc(var(--d)*400ms)}
#tw.ni .hx.av{animation:breathe 2.6s ease-in-out infinite}
#tw.ni .hx.ow,#tw.ni .hx.lk,#tw.ni .hx.ct{animation:none}
.hx.buy{animation:buy .6s cubic-bezier(.3,1.6,.5,1)!important}
.hx.ul{animation:unlock .8s ease-out!important}
.hx.no{animation:shk .4s!important}
@keyframes pop{0%{scale:0;rotate:-40deg}100%{scale:1;rotate:0deg}}
@keyframes breathe{50%{scale:1.05}}
@keyframes sheen{0%{background-position:120% 0}45%,100%{background-position:-20% 0}}
@keyframes buy{0%{scale:1;filter:brightness(2.2)}35%{scale:1.4;rotate:14deg}100%{scale:1;rotate:0deg}}
@keyframes unlock{0%{transform:rotateY(90deg) scale(.5)}60%{transform:rotateY(-15deg) scale(1.2)}100%{transform:none}}
@keyframes shk{25%{translate:-7px 0}75%{translate:7px 0}}
.bp{position:absolute;width:16px;height:14px;margin:-7px 0 0 -8px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);animation:fly .75s ease-out forwards;pointer-events:none;z-index:9}
.rg{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border:6px solid #fff3d6;border-radius:50%;animation:rng .6s ease-out forwards;pointer-events:none;z-index:8}
@keyframes fly{to{translate:var(--dx) var(--dy);rotate:300deg;scale:.2;opacity:0}}
@keyframes rng{from{scale:.4;opacity:1}to{scale:2.4;opacity:0}}
/* tree polish */
.hx[data-k="dmg"],#ui[data-k="dmg"]{--bc:#e8672a}
.hx[data-k="crit"],#ui[data-k="crit"]{--bc:#b45fd0}
.hx[data-k="xp"],#ui[data-k="xp"]{--bc:#5fa83a}
.hx[data-k="hp"],#ui[data-k="hp"]{--bc:#d8453b}
.hx[data-k="mag"],#ui[data-k="mag"]{--bc:#4a7fd8}
.hx[data-k="spd"],#ui[data-k="spd"]{--bc:#2fb5a8}
#upg{background:radial-gradient(ellipse at 50% 45%,rgba(120,86,38,.62),rgba(22,18,12,.92) 78%)}
#tv::before,#tv::after{content:'';position:absolute;inset:-50%;pointer-events:none}
#tv::before{background:radial-gradient(circle,rgba(255,210,90,.55) 0 2px,transparent 3px) 0 0/90px 110px;animation:drift 28s linear infinite}
#tv::after{background:radial-gradient(circle,rgba(255,243,214,.4) 0 1.5px,transparent 2.5px) 40px 60px/130px 90px;animation:drift2 40s linear infinite}
@keyframes drift{to{transform:translate(-90px,-110px)}}
@keyframes drift2{to{transform:translate(-130px,-90px)}}
#tw{will-change:transform}
.hx>i{background:radial-gradient(circle at 30% 16%,rgba(255,255,255,.5),transparent 52%),linear-gradient(transparent 55%,rgba(0,0,0,.24)),var(--c)}
.hx.av[data-k]{--c:var(--bc)}
.hx.ow>i{background:radial-gradient(circle at 30% 16%,rgba(255,255,255,.6),transparent 52%),linear-gradient(150deg,#ffe08a,#f2a93b 55%,var(--bc))}
.hx.lk>i{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.12),transparent 50%),#3b362b}
.hx.ct{animation:pop .55s cubic-bezier(.3,1.6,.5,1) backwards,bob 3s ease-in-out infinite}
.hx.ct>i{background:radial-gradient(circle at 30% 16%,rgba(255,255,255,.55),transparent 52%),linear-gradient(150deg,#69b4ff,#2f6fc4)}
@keyframes bob{50%{translate:0 -3px}}
.hx.sel>i{filter:brightness(1.12)}
#uh h2{letter-spacing:.5px}
#uc{border:3px solid #ffd23a;box-shadow:0 3px 0 rgba(0,0,0,.5);text-shadow:1px 1px 0 #000}
#zb .btn{min-width:0;width:48px;height:48px;padding:0;font-size:30px;line-height:1;border-radius:50%}
#ui{background:linear-gradient(#f6e6b8,#ecd596);position:relative}
#ui .bg{position:relative;width:72px;height:63px;flex:none;display:grid;place-items:center;background:var(--ink);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
#ui .bg i{position:absolute;inset:4px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:radial-gradient(circle at 30% 16%,rgba(255,255,255,.5),transparent 55%),var(--bc,#4aa3c8)}
#ui .bg svg{position:relative;width:38px;height:38px}
.pps{display:flex;gap:5px;margin-top:5px}
.pp{width:22px;height:19px;background:#b9ab82;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.pp.on{background:#f2a93b}.pp.cur{background:var(--bc,#4aa3c8);animation:breathe 1.6s ease-in-out infinite}
#ui .btn.sm.pri{font-size:22px;padding:6px 18px;text-shadow:2px 2px 0 var(--ink);animation:breathe 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#tv::before,#tv::after,#ui .btn.pri,.hx.ct{animation:none!important}}
/* tree v3 */
#upg{background:radial-gradient(ellipse at 50% 45%,rgba(62,70,88,.6),rgba(12,14,20,.95) 80%)}
#tv::before,#tv::after{display:none}
.hx>i{background:var(--rim,rgba(255,255,255,.38))!important}
.hx.ow{--rim:#ffd23a}
.hx>i::after{content:'';position:absolute;inset:4px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:radial-gradient(circle at 30% 16%,rgba(255,255,255,.5),transparent 52%),linear-gradient(transparent 55%,rgba(0,0,0,.25)),var(--c);background-size:auto;animation:none}
.hx.av>i::after{background:radial-gradient(circle at 30% 16%,rgba(255,255,255,.45),transparent 52%),linear-gradient(transparent 45%,rgba(0,0,0,.4)),var(--bc);filter:brightness(.82)}
.hx.ow>i::after{inset:4px;background:radial-gradient(circle at 30% 16%,rgba(255,255,255,.55),transparent 52%),linear-gradient(transparent 55%,rgba(0,0,0,.2)),var(--bc);background-size:auto;animation:none}
.hx.lk>i::after{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.1),transparent 50%),#3b362b}
.hx.ct>i::after{background:radial-gradient(circle at 30% 16%,rgba(255,255,255,.55),transparent 52%),linear-gradient(150deg,#69b4ff,#2f6fc4)}
.hx svg{width:36px;height:36px}
.hx u{font-size:14px}
.hx em{display:flex;align-items:center;gap:3px}
.hx em svg{width:12px;height:12px}
.hx .cap{position:absolute;top:2px;font:400 15px/1 Chewy,cursive;color:#ffd23a;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill}
#ui .btn svg{width:18px;height:18px}
#uc{position:relative;display:flex;align-items:center;justify-content:flex-end;height:42px;min-width:120px;margin-left:24px;padding:0 16px 0 34px;background:linear-gradient(#5a4129,#3a2a1c);border:3px solid var(--ink);border-radius:24px;box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.18);color:var(--cream);font:400 28px/1 Chewy,cursive;text-shadow:none}
#uc b{font-weight:400;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
#uc .nut{position:absolute;left:-22px;top:50%;translate:0 -50%;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3d6,#e6cf92);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.45)}
#uc .nut svg{width:34px;height:34px}
#uc.bump{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{scale:1.15}}
/* run setup menu */
#select{justify-content:flex-start;gap:8px;background:rgba(31,28,22,.72);padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
#sg{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;width:min(1000px,96vw)}
#sg section:first-child{grid-column:1/-1}
@media (max-width:760px){#sg{grid-template-columns:1fr}}
#sg section{background:var(--paper);border:4px solid var(--ink);border-radius:26px 32px 24px 34px;box-shadow:5px 6px 0 var(--ink);padding:8px 14px 14px;text-align:left}
#sg h3{font-size:24px;margin:0 0 6px}
.opt{flex:1 1 118px;min-width:108px;background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:8px 6px;cursor:pointer;box-shadow:3px 4px 0 var(--ink);text-align:center;transition:transform .15s;animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.opt:hover{transform:translateY(-4px) rotate(-1.5deg)}
.opt.cur{background:#ffe29a;box-shadow:0 0 0 4px var(--orange),3px 4px 0 var(--ink);transform:translateY(-3px)}
#select.re .opt{animation:none}
.opt h4{font:400 21px/1.05 Chewy,cursive;margin:2px 0}
.opt .mini{font-size:17px;line-height:1.05}
.opt .rw{color:#8a3b00}
.opt .ico{width:54px;height:54px;font-size:30px;margin:0 auto 2px}
.opt .dic svg{width:44px;height:44px}
.opt.chip .dic svg{width:30px;height:30px}
.opt.mod .dic svg{width:36px;height:36px}
#sum{font-size:24px;color:var(--cream);text-shadow:2px 2px 0 var(--ink)}
/* setup v2: one page, no scroll */
#select{font-size:clamp(11px,2.3vh,19px);gap:.5em;padding:calc(env(safe-area-inset-top,0px) + .5em) .8em calc(env(safe-area-inset-bottom,0px) + .5em);overflow:hidden;justify-content:space-between;background:radial-gradient(ellipse at 50% 40%,rgba(40,36,28,.45),rgba(14,12,8,.84))}
#select h2{font-size:2.3em;line-height:1}
#sg{flex:1;min-height:0;width:min(1120px,97vw);grid-template-columns:1fr 1.1fr 1fr;gap:1.3em 1.1em;align-content:center;align-items:start}
#sg section,#sg section:first-child{grid-column:auto}
#sg section{position:relative;margin-top:.9em;padding:1em .7em .7em}
#sg h3{position:absolute;top:-.85em;left:.8em;margin:0;padding:.05em .8em;font-size:1.35em;line-height:1.1;color:var(--cream);background:var(--ink);border-radius:.8em .8em .8em .2em;transform:rotate(-2deg)}
#sg h3:nth-of-type(2){position:static;display:block;background:none;color:var(--ink);padding:0;margin:.6em 0 .3em;font-size:1.2em;transform:none;text-decoration:underline wavy rgba(43,33,24,.35)}
#sg .row{flex-direction:column;flex-wrap:nowrap;gap:.45em;justify-content:flex-start}
#sc-times{flex-direction:row!important}
#select .opt{display:flex;align-items:center;gap:.6em;width:100%;min-width:0;flex:0 0 auto;padding:.4em .6em;border-radius:1em;text-align:left;box-shadow:.15em .2em 0 var(--ink)}
#select .opt:hover{transform:translateX(.25em) rotate(-.6deg)}
